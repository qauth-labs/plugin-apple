# The end-to-end suite's deployment (run.sh starts it): QAuth's server with
# this plugin added (Dockerfile), its migration runner, PostgreSQL, Redis and
# a mock Apple.
#
# QAUTH_IMAGE and QAUTH_MIGRATION_IMAGE are the QAuth images run.sh names:
# until a released image carries the preset loader (qauth-labs/qauth#671),
# the ones qauth-images.sh builds from the commit e2e/qauth-commit names.
#
# The mock answers at Apple's own host name, appleid.apple.com, a network
# alias: the server's egress client resolves names through DNS. It sits on a
# network of its own with a public address range, 17.0.0.0/8 being Apple's,
# because that is what the server reaches in production: a preset's calls go
# to the origins it lists as remote_document destinations, which the
# deployment's egress allowlist never opens to a private address. The server
# is on both networks; nothing else is on the mock's.
#
# The secrets (JWT keys, KEK, session cookie secret) and the mock's Team ID,
# Key ID and the public half of the test key come from run.sh's environment,
# made fresh for each run.
name: plugin-apple-e2e

x-server: &server
  build:
    context: .
    dockerfile: Dockerfile
    args:
      QAUTH_IMAGE: ${QAUTH_IMAGE:?run e2e/run.sh}
  image: plugin-apple-e2e/auth-server:local
  environment: &server-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '3000'
    LOG_LEVEL: info
    DATABASE_URL: postgres://qauth:qauth@postgres:5432/qauth
    REDIS_URL: redis://redis:6379/0
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_DB: '0'
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run e2e/run.sh}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run e2e/run.sh}
    JWT_ISSUER: http://localhost:3000
    KEK: ${KEK:?run e2e/run.sh}
    SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?run e2e/run.sh}
    # The suite talks to the server over plain http on localhost.
    SESSION_COOKIE_SECURE: 'false'
    # Required at boot; the suite sends no mail (the mock email provider).
    EMAIL_FROM_ADDRESS: noreply@qauth.test
    EMAIL_BASE_URL: http://localhost:3000
    # The first boot seeds the master realm with sign-up allowed, so a first
    # sign-in through Apple may create the account.
    ALLOW_SIGN_UP: 'true'
    # The suite signs in several times from one address.
    RATE_LIMIT_MAX: '10000'
    LOGIN_RATE_LIMIT: '1000'
    AUTHORIZE_RATE_LIMIT: '1000'
    TOKEN_RATE_LIMIT: '1000'
    REGISTER_CLIENT_RATE_LIMIT: '100'
    # The plugin, as an operator installs it.
    AUTH_METHOD_PLUGINS: '@qauth-labs/plugin-apple'
    PLUGIN_API_ENABLED: 'true'
    EGRESS_ALLOWLIST_PATH: /etc/qauth/egress-allowlist.json
    # The mock's certificate is signed by run.sh's throwaway CA.
    NODE_EXTRA_CA_CERTS: /etc/qauth/e2e-ca.crt
    # The admin API configures the plugin for the realm. Its base URL is only
    # what DPoP proofs name (htu); the suite reaches it on port 3002.
    ADMIN_API_ENABLED: 'true'
    ADMIN_API_HOST: 0.0.0.0
    ADMIN_API_PORT: '3002'
    ADMIN_API_BASE_URL: https://admin.qauth.test
    DPOP_ENABLED: 'true'
  volumes:
    - ./egress-allowlist.json:/etc/qauth/egress-allowlist.json:ro
    - ./.work/certs/ca.crt:/etc/qauth/e2e-ca.crt:ro

networks:
  default: {}
  # Apple's provider, as the server reaches it: a public address.
  apple:
    ipam:
      config:
        - subnet: 17.111.80.0/28

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: qauth
      POSTGRES_USER: qauth
      POSTGRES_PASSWORD: qauth
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qauth -d qauth']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: ${QAUTH_MIGRATION_IMAGE:?run e2e/run.sh}
    environment:
      DATABASE_URL: postgres://qauth:qauth@postgres:5432/qauth
    depends_on:
      postgres:
        condition: service_healthy

  mock-apple:
    image: node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
    command: ['node', '/mock/server.mjs']
    environment:
      MOCK_APPLE_SERVICES_ID: ${MOCK_APPLE_SERVICES_ID:?run e2e/run.sh}
      MOCK_APPLE_TEAM_ID: ${MOCK_APPLE_TEAM_ID:?run e2e/run.sh}
      MOCK_APPLE_KEY_ID: ${MOCK_APPLE_KEY_ID:?run e2e/run.sh}
      MOCK_APPLE_PUBLIC_KEY: ${MOCK_APPLE_PUBLIC_KEY:?run e2e/run.sh}
      MOCK_APPLE_REDIRECT_URI: http://localhost:3000/upstream/apple/callback
    volumes:
      - ./mock-apple:/mock:ro
      - ./.work/certs:/certs:ro
    networks:
      apple:
        aliases: [appleid.apple.com]
    # The suite plays the browser at the mock's authorization page, and reads
    # its control API, from the host.
    ports:
      - 127.0.0.1:8443:443

  auth-server:
    <<: *server
    networks: [default, apple]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-apple:
        condition: service_started
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:3002:3002

  # The same image and plugin with the experimental plugin API off: the boot
  # must skip the plugin and say why. run.sh starts it after the first server
  # has seeded the database.
  auth-server-plugin-api-off:
    <<: *server
    environment:
      <<: *server-env
      PLUGIN_API_ENABLED: 'false'
      ADMIN_API_ENABLED: 'false'
    networks: [default]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:3010:3000
    profiles: [plugin-api-off]
